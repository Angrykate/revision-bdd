<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision — Bases de Données Distribuées</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --bg3: #1a2236;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0f4ff;
  --text2: #8b9cbf;
  --text3: #5a6a8a;
  --accent: #4f8ef7;
  --accent2: #38d9a9;
  --danger: #ff6b6b;
  --success: #51cf66;
  --radius: 12px;
  --radius2: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

.hero {
  background: linear-gradient(135deg, #0a0e1a 0%, #0d1b3e 50%, #0a1628 100%);
  padding: 3rem 1.5rem 2rem; text-align: center; position: relative; overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.hero::before {
  content: ''; position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(79,142,247,0.12) 0%, transparent 70%);
  top: -200px; left: 50%; transform: translateX(-50%); pointer-events: none;
}
.hero-badge {
  display: inline-block; background: rgba(79,142,247,0.15); border: 1px solid rgba(79,142,247,0.3);
  color: #7eb3ff; font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 5px 14px; border-radius: 20px; margin-bottom: 1rem;
}
.hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; color: #fff; line-height: 1.15; margin-bottom: 0.5rem; }
.hero h1 span { background: linear-gradient(135deg, #4f8ef7, #38d9a9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero p { color: var(--text2); font-size: 0.95rem; margin-bottom: 1.5rem; }
.tech-pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tech-pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid; font-weight: 500; cursor: pointer; transition: all 0.2s; background: transparent; font-family: 'DM Sans', sans-serif; }
.tech-pill:hover { transform: translateY(-2px); }

.wrapper { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

.mode-tabs { display: flex; gap: 4px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; margin-bottom: 1.5rem; }
.mode-tab { flex: 1; padding: 10px 8px; border: none; background: transparent; color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--radius2); transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
.mode-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(79,142,247,0.35); }

.tech-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
.tech-btn { padding: 7px 16px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg2); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
.tech-btn:hover { border-color: var(--border2); color: var(--text); }
.tech-btn.active { color: #0a0e1a; border-color: transparent; }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; transition: border-color 0.2s; }
.card:hover { border-color: var(--border2); }
.card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 1rem; }
.tech-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.card-header h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
.type-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 6px; margin-top: 4px; }

.section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 8px; margin-top: 14px; }
.section-title:first-child { margin-top: 0; }
p, li { font-size: 14px; color: var(--text2); line-height: 1.65; }
ul { padding-left: 18px; }
li { margin-bottom: 4px; }
li::marker { color: var(--text3); }
code { font-family: 'DM Mono', monospace; font-size: 12px; background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 4px; color: #a8d0ff; }
pre { font-family: 'DM Mono', monospace; font-size: 12px; background: #070c18; border: 1px solid var(--border); border-radius: var(--radius2); padding: 12px 14px; overflow-x: auto; line-height: 1.7; color: #c8deff; margin: 6px 0 10px; white-space: pre; }
.syntax-label { font-size: 12px; font-weight: 500; color: var(--text3); margin-top: 12px; margin-bottom: 2px; font-family: 'DM Mono', monospace; }

.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pros-cons-box { background: var(--bg3); border-radius: var(--radius2); padding: 12px; }
.pros-cons-box h4 { font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
.pros-cons-box.pros h4 { color: var(--success); }
.pros-cons-box.cons h4 { color: var(--danger); }

/* DEEP DIVE */
.deep-toggle {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 11px 16px;
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--radius2); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--text2); transition: all 0.2s; margin-top: 4px;
  justify-content: space-between;
}
.deep-toggle:hover { border-color: var(--border2); color: var(--text); }
.deep-toggle .arrow { transition: transform 0.3s; font-size: 16px; }
.deep-toggle.open { color: var(--text); }
.deep-toggle.open .arrow { transform: rotate(180deg); }
.deep-content {
  display: none; margin-top: 8px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius2); padding: 1.2rem;
  animation: fadeIn 0.25s ease;
}
.deep-content.visible { display: block; }
.deep-section { margin-bottom: 1.2rem; }
.deep-section:last-child { margin-bottom: 0; }
.deep-section h4 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.deep-section p { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 6px; }
.analogy-box { background: rgba(79,142,247,0.08); border-left: 3px solid var(--accent); border-radius: 0 var(--radius2) var(--radius2) 0; padding: 10px 14px; margin: 8px 0; font-size: 13px; color: var(--text2); }
.analogy-box strong { color: #7eb3ff; }
.concept-pill { display: inline-block; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text2); margin: 2px; }
.warning-box { background: rgba(249,168,37,0.08); border-left: 3px solid #f9a825; border-radius: 0 var(--radius2) var(--radius2) 0; padding: 10px 14px; margin: 8px 0; font-size: 13px; color: var(--text2); }
.warning-box strong { color: #f9a825; }

/* QCM */
.qcm-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
.score-display { display: flex; align-items: baseline; gap: 6px; }
.score-big { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: #fff; }
.score-sub { font-size: 13px; color: var(--text2); }
.progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s; }

.qcm-page-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 1.2rem; }
.page-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius2); background: var(--bg2); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.page-btn:hover { border-color: var(--border2); color: var(--text); }
.page-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.08); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-label { font-size: 12px; color: var(--text3); margin-left: auto; }

.qcm-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
.qcm-q-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.qcm-q { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 12px; line-height: 1.5; }
.qcm-opt { display: block; width: 100%; padding: 10px 14px; margin: 6px 0; border: 1px solid var(--border); border-radius: var(--radius2); background: var(--bg3); color: var(--text2); font-size: 13px; cursor: pointer; text-align: left; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
.qcm-opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.qcm-opt.correct { background: rgba(81,207,102,0.12); border-color: var(--success); color: #a3e6ae; }
.qcm-opt.wrong { background: rgba(255,107,107,0.12); border-color: var(--danger); color: #ffaaaa; }
.qcm-opt.reveal { background: rgba(81,207,102,0.06); border-color: rgba(81,207,102,0.3); color: rgba(163,230,174,0.6); }
.qcm-expl { margin-top: 10px; padding: 10px 14px; background: rgba(79,142,247,0.08); border-left: 3px solid var(--accent); border-radius: 0 var(--radius2) var(--radius2) 0; font-size: 13px; color: var(--text2); display: none; }
.reset-btn { padding: 8px 18px; background: transparent; border: 1px solid var(--border2); color: var(--text2); font-size: 13px; font-weight: 500; border-radius: var(--radius2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

/* COMPARE */
.compare-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
thead th { padding: 10px 14px; background: var(--bg3); color: var(--text3); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; text-align: left; border-bottom: 1px solid var(--border); }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
tbody tr:hover td { background: var(--bg3); }
tbody td:first-child { color: #fff; font-weight: 500; }
.memo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 8px; }
.memo-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius2); padding: 12px 14px; }
.memo-card h4 { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.memo-card p { font-size: 12px; color: var(--text2); }

.hidden { display: none !important; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card, .qcm-card { animation: fadeIn 0.3s ease; }

footer { text-align: center; padding: 2rem 1rem 1.5rem; border-top: 1px solid var(--border); margin-top: 2rem; }
.footer-inner { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.footer-text { font-size: 12px; color: var(--text3); }
.signature {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  background: linear-gradient(135deg, #4f8ef7, #38d9a9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 0.04em;
}
.signature::before { content: '◈'; font-size: 10px; background: linear-gradient(135deg, #4f8ef7, #38d9a9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

@media (max-width: 600px) {
  .hero { padding: 2rem 1rem 1.5rem; }
  .pros-cons { grid-template-columns: 1fr; }
  .mode-tab { font-size: 11px; padding: 8px 4px; }
  .tech-btn { font-size: 11px; padding: 5px 12px; }
  pre { font-size: 11px; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Programmation Distribuée</div>
  <h1>Révision <span>Bases de Données</span><br>NoSQL &amp; Distribuées</h1>
  <p>7 technologies · Fiches · QCM · Comparatif</p>
  <div class="tech-pills" id="hero-pills"></div>
</div>

<div class="wrapper">
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('fiches',this)">📄 Fiches</button>
    <button class="mode-tab" onclick="setMode('qcm',this)">🎯 QCM</button>
    <button class="mode-tab" onclick="setMode('compare',this)">⚡ Comparatif</button>
  </div>
  <div id="fiches-section"><div class="tech-nav" id="tech-nav"></div><div id="fiche-content"></div></div>
  <div id="qcm-section" class="hidden">
    <div class="qcm-header">
      <div class="score-display"><span class="score-big" id="score-num">0</span><span class="score-sub">/ <span id="score-tot">0</span> répondues</span></div>
      <button class="reset-btn" onclick="resetQCM()">↺ Recommencer tout</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div class="qcm-page-nav">
      <button class="page-btn active" id="pbtn1" onclick="setQCMPage(1)">Série 1</button>
      <button class="page-btn" id="pbtn2" onclick="setQCMPage(2)">Série 2</button>
      <span class="page-label" id="page-label">Série 1 — 21 questions</span>
    </div>
    <div id="qcm-content"></div>
    <div style="display:flex;gap:10px;margin-top:1rem;">
      <button class="page-btn" id="prev-btn" onclick="setQCMPage(1)" disabled>← Précédent</button>
      <button class="page-btn" id="next-btn" onclick="setQCMPage(2)">Suivant →</button>
    </div>
  </div>
  <div id="compare-section" class="hidden"><div id="compare-content"></div></div>
</div>

<footer>
  <div class="footer-inner">
    <span class="footer-text">Guide de révision · Bases de données distribuées</span>
    <span class="footer-text">·</span>
    <span class="signature">Illane</span>
    <span class="footer-text">·</span>
    <span class="footer-text">Bonne chance 🚀</span>
  </div>
</footer>

<script>
const techs = [
  {
    name:"MongoDB", emoji:"🍃", type:"Base documentaire",
    color:"#38d9a9", colorBg:"rgba(56,217,169,0.12)", tagBg:"rgba(56,217,169,0.15)", tagColor:"#38d9a9",
    quoi:"Base NoSQL orientée documents. Les données sont stockées en JSON/BSON dans des collections, sans schéma fixe imposé.",
    quand:"Applications web, catalogues produits, gestion de contenu, données semi-structurées ou variables.",
    concepts:["Document : unité de base, similaire à un objet JSON","Collection : ensemble de documents (≈ table SQL)","Base de données : ensemble de collections","BSON : format binaire de JSON, supporte plus de types","_id : identifiant unique obligatoire de chaque document","Schéma flexible : documents d'une même collection peuvent différer","Indexation : sur n'importe quel champ pour accélérer les requêtes","Agrégation : pipeline de transformation ($group, $match, $sort...)"],
    syntaxe:[
      ["Insérer un document","db.users.insertOne({ name: \"Alice\", age: 25 })"],
      ["Insérer plusieurs","db.users.insertMany([{ name: \"Bob\" }, { name: \"Eve\" }])"],
      ["Lire tous les docs","db.users.find()"],
      ["Filtrer (age > 20)","db.users.find({ age: { $gt: 20 } })"],
      ["Mettre à jour","db.users.updateOne({ name: \"Alice\" }, { $set: { age: 26 } })"],
      ["Supprimer","db.users.deleteOne({ name: \"Alice\" })"],
      ["Compter","db.users.countDocuments({ age: { $gt: 18 } })"],
      ["Tri + limite","db.users.find().sort({ age: -1 }).limit(5)"],
      ["Agrégation","db.orders.aggregate([\n  { $group: { _id: \"$city\", total: { $sum: \"$amount\" } } }\n])"],
      ["Opérateurs comparaison","$eq, $ne, $gt, $gte, $lt, $lte, $in, $nin"],
      ["Opérateurs logiques","$and, $or, $not, $nor"]
    ],
    avantages:["Schéma flexible (évolution facile)","Scalabilité horizontale","Requêtes riches et expressives","Large communauté"],
    inconvenients:["Pas idéal pour données très relationnelles","Consomme plus de mémoire (BSON)","Transactions ACID limitées avant v4"],
    deep: {
      intro: "MongoDB est souvent la première base NoSQL qu'on découvre. Comprendre ses fondements aide à saisir pourquoi elle existe et quand l'utiliser.",
      sections: [
        {
          title: "🔑 Pourquoi pas SQL ?",
          body: "Dans une base SQL classique, tout est structuré en tables rigides avec des colonnes fixes. Si tu veux ajouter un champ à un utilisateur, tu dois modifier toute la table. MongoDB résout ça : chaque document est indépendant et peut avoir ses propres champs.",
          analogy: "<strong>Analogie :</strong> SQL c'est comme un formulaire papier avec des cases fixes. MongoDB c'est une feuille libre où chaque personne écrit ce qu'elle veut — certains mettent un téléphone, d'autres pas.",
          extra: ""
        },
        {
          title: "📦 BSON vs JSON",
          body: "JSON est lisible par l'humain mais limité en types (pas de dates natives, pas de binaire). MongoDB stocke en BSON qui est la version binaire du JSON, plus rapide à lire pour les machines et qui supporte des types supplémentaires : Date, ObjectId, Binary, Decimal128...",
          analogy: "<strong>Important :</strong> Quand tu écris une requête MongoDB, tu utilises du JSON. Mais en interne, MongoDB stocke en BSON. La conversion est automatique.",
          extra: ""
        },
        {
          title: "🔗 Agrégation — comment ça marche ?",
          body: "Le pipeline d'agrégation fonctionne comme une chaîne de montage. Chaque étape transforme les données et les passe à l'étape suivante. Les étapes principales sont :<br><br>• <code>$match</code> : filtrer (comme WHERE en SQL)<br>• <code>$group</code> : regrouper et calculer (comme GROUP BY)<br>• <code>$sort</code> : trier<br>• <code>$project</code> : choisir les champs à retourner<br>• <code>$limit</code> / <code>$skip</code> : pagination",
          analogy: "<strong>Analogie :</strong> Imagine une usine avec des machines en série. Les documents entrent bruts, passent par $match (triage), $group (assemblage), $sort (rangement), et sortent transformés.",
          extra: ""
        },
        {
          title: "⚠️ Quand NE PAS utiliser MongoDB ?",
          body: "MongoDB est mauvais choix si tes données sont très liées entre elles (ex: un système bancaire avec comptes, transactions, virements). Les jointures en MongoDB ($lookup) existent mais sont moins performantes. Pour ces cas : PostgreSQL ou MySQL sont plus adaptés.",
          analogy: "<strong>Règle simple :</strong> si ton schéma ressemble à un arbre (objet avec sous-objets) → MongoDB. Si ça ressemble à un tableau croisé avec beaucoup de relations → SQL.",
          extra: ""
        }
      ]
    }
  },
  {
    name:"ELK Stack", emoji:"🔍", type:"Recherche & Analytique",
    color:"#4f8ef7", colorBg:"rgba(79,142,247,0.12)", tagBg:"rgba(79,142,247,0.15)", tagColor:"#4f8ef7",
    quoi:"ELK = Elasticsearch + Logstash + Kibana. Suite pour ingestion, stockage, recherche full-text et visualisation de grandes quantités de données.",
    quand:"Analyse de logs, monitoring d'applications, moteur de recherche, tableaux de bord temps réel.",
    concepts:["Elasticsearch : moteur de recherche distribué basé sur Apache Lucene","Logstash : pipeline d'ingestion (collecter → transformer → envoyer)","Kibana : interface de visualisation et exploration","Index : stocke des documents JSON (≈ base de données)","Mapping : définition des types de champs d'un index","Shard : fragment d'un index réparti sur les nœuds","Replica : copie d'un shard pour la redondance","Nœud (Node) : serveur Elasticsearch","Cluster : ensemble de nœuds"],
    syntaxe:[
      ["Créer un index","PUT /my_index"],
      ["Insérer un document","PUT /my_index/_doc/1\n{ \"title\": \"Guide NoSQL\", \"author\": \"Alice\" }"],
      ["Recherche simple (match)","GET /my_index/_search\n{ \"query\": { \"match\": { \"title\": \"guide\" } } }"],
      ["Multi-champ","GET /my_index/_search\n{ \"query\": { \"multi_match\": {\n    \"query\": \"guide\",\n    \"fields\": [\"title\", \"body\"] } } }"],
      ["Filtre exact (term)","{ \"query\": { \"term\": { \"author\": \"Alice\" } } }"],
      ["Plage de valeurs","{ \"query\": { \"range\": { \"age\": { \"gte\": 18, \"lte\": 65 } } } }"],
      ["Agrégation","{ \"aggs\": { \"by_author\": { \"terms\": { \"field\": \"author\" } } } }"],
      ["Supprimer un index","DELETE /my_index"],
      ["Mise à jour partielle","POST /my_index/_update/1\n{ \"doc\": { \"title\": \"Nouveau titre\" } }"]
    ],
    avantages:["Full-text search très performant","Scalabilité horizontale","Visualisation avec Kibana","Analyse temps réel"],
    inconvenients:["Pas conçu pour transactions ACID","Complexe à administrer","Consomme beaucoup de ressources"],
    deep: {
      intro: "La puissance de ELK vient du fait que les 3 outils se complètent parfaitement. Comprendre le rôle de chacun et comment ils fonctionnent ensemble est essentiel.",
      sections: [
        {

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Hero pills
techs.forEach((t,i) => {
  const b = document.createElement('button');
  b.className='tech-pill';
  b.textContent = t.emoji+' '+t.name;
  b.style.cssText=`border-color:${t.color};color:${t.color};`;
  b.onclick=()=>{ setMode('fiches',document.querySelector('.mode-tab')); showTech(i); };
  document.getElementById('hero-pills').appendChild(b);
});

// Tech nav
techs.forEach((t,i) => {
  const b = document.createElement('button');
  b.className='tech-btn'+(i===0?' active':'');
  b.textContent=t.emoji+' '+t.name;
  if(i===0){b.style.background=t.color;b.style.borderColor=t.color;b.style.color='#0a0e1a';}
  b.onclick=()=>showTech(i);
  document.getElementById('tech-nav').appendChild(b);
});

function showTech(idx){
  currentTech=idx;
  document.querySelectorAll('.tech-btn').forEach((b,i)=>{
    b.classList.toggle('active',i===idx);
    b.style.background=i===idx?techs[idx].color:'';
    b.style.borderColor=i===idx?techs[idx].color:'';
    b.style.color=i===idx?'#0a0e1a':'';
  });
  renderFiche(techs[idx]);
}

function renderFiche(t){
  const deepId='deep-'+t.name.replace(/\s/g,'');
  let deepSections = t.deep.sections.map((s,i)=>`
    <div class="deep-section">
      <h4>${s.title}</h4>
      <p>${s.body}</p>
      <div class="analogy-box">${s.analogy}</div>
      ${s.extra?`<p>${s.extra}</p>`:''}
    </div>`).join('<hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">');

  document.getElementById('fiche-content').innerHTML=`
  <div class="card">
    <div class="card-header">
      <div class="tech-icon" style="background:${t.colorBg};font-size:26px;">${t.emoji}</div>
      <div><h2 style="color:${t.color}">${t.name}</h2><span class="type-tag" style="background:${t.tagBg};color:${t.tagColor}">${t.type}</span></div>
    </div>
    <div class="section-title">C'est quoi ?</div><p>${t.quoi}</p>
    <div class="section-title">Quand l'utiliser ?</div><p>${t.quand}</p>
  </div>
  <div class="card">
    <div class="section-title">Concepts clés à retenir</div>
    <ul>${t.concepts.map(c=>`<li>${c}</li>`).join('')}</ul>
    <button class="deep-toggle" id="btn-${deepId}" onclick="toggleDeep('${deepId}')">
      <span>🔬 Approfondir — explications détaillées et analogies</span>
      <span class="arrow">▼</span>
    </button>
    <div class="deep-content" id="${deepId}">
      <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">${t.deep.intro}</p>
      ${deepSections}
    </div>
  </div>
  <div class="card">
    <div class="section-title">Syntaxe essentielle</div>
    ${t.syntaxe.map(([label,code])=>`<div class="syntax-label">// ${label}</div><pre>${esc(code)}</pre>`).join('')}
  </div>
  <div class="card">
    <div class="pros-cons">
      <div class="pros-cons-box pros"><h4>✅ Avantages</h4><ul>${t.avantages.map(a=>`<li>${a}</li>`).join('')}</ul></div>
      <div class="pros-cons-box cons"><h4>⚠️ Limites</h4><ul>${t.inconvenients.map(i=>`<li>${i}</li>`).join('')}</ul></div>
    </div>
  </div>`;
}

function toggleDeep(id){
  const content=document.getElementById(id);
  const btn=document.getElementById('btn-'+id);
  const open=content.classList.toggle('visible');
  btn.classList.toggle('open',open);
  if(open) content.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function setQCMPage(page){
  currentQCMPage=page;
  document.getElementById('pbtn1').classList.toggle('active',page===1);
  document.getElementById('pbtn2').classList.toggle('active',page===2);
  document.getElementById('page-label').textContent=`Série ${page} — 21 questions`;
  document.getElementById('prev-btn').disabled=page===1;
  document.getElementById('next-btn').disabled=page===2;
  renderQCMPage(page);
  updateScore();
}

function renderQCMPage(page){
  const data=page===1?qcmPage1:qcmPage2;
  const prefix=page===1?'p1':'p2';
  const aSet=page===1?answeredSetP1:answeredSetP2;
  let html='';
  data.forEach((q,i)=>{
    html+=`<div class="qcm-card">
      <div class="qcm-q-label" style="color:${q.color}">${q.tech}</div>
      <div class="qcm-q">${i+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<button class="qcm-opt" id="${prefix}-opt-${i}-${oi}" onclick="answer(${i},${oi},${page})"${aSet.has(i)?' disabled':''} >${o}</button>`).join('')}
      <div class="qcm-expl" id="${prefix}-expl-${i}" style="${aSet.has(i)?'display:block':''}">${aSet.has(i)?`<strong>Explication :</strong> ${q.expl}`:''}</div>
    </div>`;
  });
  document.getElementById('qcm-content').innerHTML=html;
  // Re-apply styling for already answered
  if(aSet.size>0){
    const data2=page===1?qcmPage1:qcmPage2;
    aSet.forEach(qi=>{
      // We need to know what was answered — store it
    });
  }
}

function answer(qi,oi,page){
  const data=page===1?qcmPage1:qcmPage2;
  const prefix=page===1?'p1':'p2';
  const aSet=page===1?answeredSetP1:answeredSetP2;
  if(aSet.has(qi)) return;
  aSet.add(qi);
  const q=data[qi];
  const correct=q.ans===oi;
  if(page===1){if(correct)scoresP1++;answeredP1++;}
  else{if(correct)scoresP2++;answeredP2++;}
  q.opts.forEach((_,o)=>{
    const btn=document.getElementById(`${prefix}-opt-${qi}-${o}`);
    if(!btn)return;
    btn.disabled=true;
    if(o===oi&&correct)btn.classList.add('correct');
    else if(o===oi)btn.classList.add('wrong');
    else if(o===q.ans)btn.classList.add('reveal');
  });
  const expl=document.getElementById(`${prefix}-expl-${qi}`);
  if(expl){expl.innerHTML=`<strong>Explication :</strong> ${q.expl}`;expl.style.display='block';}
  updateScore();
}

function updateScore(){
  const totalAnswered=answeredP1+answeredP2;
  const totalScore=scoresP1+scoresP2;
  document.getElementById('score-num').textContent=totalScore;
  document.getElementById('score-tot').textContent=totalAnswered;
  document.getElementById('prog').style.width=(totalAnswered/42*100)+'%';
}

function resetQCM(){
  scoresP1=0;scoresP2=0;answeredP1=0;answeredP2=0;
  answeredSetP1=new Set();answeredSetP2=new Set();
  currentQCMPage=1;
  setQCMPage(1);
}

function renderCompare(){
  const colors={"MongoDB":"#38d9a9","Elasticsearch":"#4f8ef7","Neo4j":"#b197fc","Cassandra":"#f9a825","Redis":"#ff6b6b","CouchDB":"#ffa94d","DynamoDB":"#69db7c"};
  document.getElementById('compare-content').innerHTML=`
  <div class="card">
    <div class="section-title">Vue d'ensemble — à mémoriser</div>
    <div class="compare-table-wrap">
      <table>
        <thead><tr>${['Technologie','Modèle','Langage','CAP','Cas d\'usage','Entités'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${compareRows.map(r=>`<tr>
          <td style="color:${colors[r.name]||'#fff'}">${r.name}</td>
          <td>${r.model}</td><td><code>${r.lang}</code></td>
          <td><span style="font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,0.07)">${r.cap}</span></td>
          <td>${r.use}</td><td style="color:var(--text3)">${r.entities}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="section-title">Mémo associations rapides</div>
    <div class="memo-grid" style="margin-top:8px;">${memos.map(m=>`<div class="memo-card"><h4>${m.icon} ${m.title}</h4><p>${m.desc}</p></div>`).join('')}</div>
  </div>`;
}

function setMode(mode,btn){
  document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  else document.querySelectorAll('.mode-tab')[mode==='fiches'?0:mode==='qcm'?1:2].classList.add('active');
  document.getElementById('fiches-section').classList.toggle('hidden',mode!=='fiches');
  document.getElementById('qcm-section').classList.toggle('hidden',mode!=='qcm');
  document.getElementById('compare-section').classList.toggle('hidden',mode!=='compare');
  if(mode==='compare')renderCompare();
  if(mode==='qcm'&&document.getElementById('qcm-content').innerHTML==='')setQCMPage(1);
}

renderFiche(techs[0]);
</script>
